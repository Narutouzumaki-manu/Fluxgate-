name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR (saves free-tier CI minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin Python version; bump here when upgrading (see TOOLS_AND_REQUIREMENTS.md §1).
  PYTHON_VERSION: "3.12"
  UV_SYSTEM_PYTHON: "1"       # let uv find the system Python installed by setup-python

jobs:
  # ---------------------------------------------------------------------------
  # Job: gitleaks — secrets scan (must run first; fail fast on leaked keys)
  # ---------------------------------------------------------------------------
  gitleaks:
    name: gitleaks (secrets scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for gitleaks --log-opts scan
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Job: lint — ruff check + ruff format --check
  # ---------------------------------------------------------------------------
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev dependencies
        run: uv sync --extra dev --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .

  # ---------------------------------------------------------------------------
  # Job: typecheck — mypy (strict on shared/, guardrails/, cache/)
  # ---------------------------------------------------------------------------
  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev dependencies
        run: uv sync --extra dev --frozen
      - name: mypy
        run: uv run mypy shared tests

  # ---------------------------------------------------------------------------
  # Job: arch — import-linter boundary check (Blueprint §5)
  # ---------------------------------------------------------------------------
  arch:
    name: arch (import-linter)
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev dependencies
        run: uv sync --extra dev --frozen
      - name: lint-imports
        run: uv run lint-imports

  # ---------------------------------------------------------------------------
  # Job: unit — all unit tests + DB migration tests (excludes slow/perf/live)
  # ---------------------------------------------------------------------------
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck, arch]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev dependencies
        # CPU torch only — avoids the 2 GB CUDA wheel download (D-006, zero-cost)
        run: uv sync --extra dev --frozen
      - name: Run unit tests
        run: |
          uv run pytest -q \
            -m "not slow and not perf and not live" \
            tests/unit \
            --cov=shared --cov=guardrails --cov=cache \
            --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # Job: contract — schema snapshots + fake-vs-protocol conformance
  # ---------------------------------------------------------------------------
  contract:
    name: contract tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck, arch]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev dependencies
        run: uv sync --extra dev --frozen
      - name: Run contract tests
        run: uv run pytest -q tests/contract

  # ---------------------------------------------------------------------------
  # Job: security — canary log-leak, tenant isolation, ReDoS (Phase 2+)
  # Runs the security test directory; passes on empty suite (Phase 1).
  # ---------------------------------------------------------------------------
  security:
    name: security tests
    runs-on: ubuntu-latest
    needs: [unit, contract]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev dependencies
        run: uv sync --extra dev --frozen
      - name: Run security tests
        run: uv run pytest -q -m security tests/security || true
        # `|| true` during Phase 1 when no security tests exist yet.
        # Remove the `|| true` after the first security test is added.

  # ---------------------------------------------------------------------------
  # Job: perf — micro-benchmarks (informational; never blocks merge)
  # Only runs on main pushes to avoid quota waste on every PR.
  # ---------------------------------------------------------------------------
  perf:
    name: perf benchmarks (informational)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [unit, contract]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev dependencies
        run: uv sync --extra dev --frozen
      - name: Run perf benchmarks
        run: uv run pytest -q --benchmark-only -m perf tests/perf || true
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: .benchmarks/
